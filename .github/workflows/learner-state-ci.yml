name: learner-state-ci

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'services/learner-state/**'
      - '.github/workflows/learner-state-ci.yml'
  push:
    branches: [develop, main]
    paths:
      - 'services/learner-state/**'
      - '.github/workflows/learner-state-ci.yml'

concurrency:
  group: learner-state-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/learner-state
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/learner-state/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: TypeScript strict typecheck
        run: npm run typecheck

      - name: Lint (core/infra boundary + Prisma guard rails)
        run: npm run lint

      - name: Nest build
        run: npm run build

      - name: Unit tests
        run: npm test

      # Testcontainers starts Postgres in the runner's Docker.
      - name: Integration tests (real Postgres)
        run: npm run test:integration

      - name: Set up Python 3.11 for the numerical oracle
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/learner-state/docs/requirements-oracle.txt

      - name: Install oracle dependencies
        run: pip install -r docs/requirements-oracle.txt

      - name: Run numerical oracle (verify_mastery_model.py)
        run: python docs/verify_mastery_model.py
