[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ali-diagnosis"
version = "0.1.0"
description = "Diagnosis domain contracts for the Adaptive Learning Intelligence Ecosystem"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.12,<3",
    "langgraph>=1,<2",
    "langchain>=1.1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]
openai = ["langchain-openai>=1,<2"]
anthropic = ["langchain-anthropic>=1,<2"]
deepseek = ["langchain-deepseek>=1.1.1,<2"]
google_genai = ["langchain-google-genai>=4.4.2,<5"]
groq = ["langchain-groq>=1.1.3,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["live: real provider calls against synthetic cases (explicit opt-in)"]

[tool.setuptools.package-data]
"ali_diagnosis.application.orchestration" = ["prompts/v1/*.md"]
